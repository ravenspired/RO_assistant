<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RO tank</title>
<style>
:root{--bg:#edf2f1;--card:#fff;--line:#d3dcda;--ink:#12262e;--muted:#60747b;--blue:#2183bd;--water:#50b6e8;--ok:#2b8a57;--warn:#b87310;--bad:#c2403a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a20;--card:#15262e;--line:#29424b;--ink:#e7f0f1;--muted:#91a8af;--blue:#5fc0ef;--water:#2996cf}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{height:64px;display:flex;align-items:center;gap:14px;padding:10px 22px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;font-weight:700}.grow{flex:1}.clock{font-size:19px;font-weight:650}
button{font:inherit;font-weight:650;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;cursor:pointer;touch-action:manipulation}
button.alt{background:transparent;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.45}
nav{display:flex;gap:8px;padding:10px 22px 0;max-width:1400px;margin:auto}nav button{padding:9px 15px;border-radius:9px 9px 0 0}nav button.active{background:var(--card);color:var(--ink);border-bottom-color:var(--card)}
main{max-width:1400px;margin:auto;padding:18px 22px 28px}.page{display:none}.page.active{display:block}
.dashboard{display:grid;grid-template-columns:minmax(370px,45%) 1fr;gap:22px;min-height:calc(100vh - 125px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.tankcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:560px}
#tank{width:min(100%,410px);height:auto}#tank .body{fill:transparent;stroke:var(--ink);stroke-width:3}#tank .tick{stroke:var(--muted);stroke-width:1.5}#tank text.tl{fill:var(--muted);font-size:11px;text-anchor:end}
#water{transition:transform .8s ease}.wave{animation:slide 3s linear infinite}@keyframes slide{to{transform:translateX(-67px)}}#pctText{font-size:44px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke-width:5px}#tank.hi #pctText{fill:#fff;stroke:#16456388}#tank.lo #pctText{fill:var(--ink);stroke:var(--bg)}
.tankstats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:12px;margin-top:12px}.stat{text-align:center;border-top:1px solid var(--line);padding-top:10px}.stat b{display:block;font-size:25px}.stat small{color:var(--muted)}
.right{display:flex;flex-direction:column;gap:16px}.status{display:flex;align-items:center;gap:12px}.status h2{margin:0;font-size:18px}.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}.dot.active{background:var(--water);box-shadow:0 0 0 5px #50b6e833}.dot.warn{background:var(--warn)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.preset{min-height:76px;font-size:19px}.custom{grid-column:span 4;background:transparent;color:var(--ink)}
h2{font-size:17px;margin:0 0 12px}.muted,.sub{color:var(--muted)}.rows{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;border-top:1px solid var(--line);padding:9px 5px}th{color:var(--muted);font-weight:500;border:0}td:not(:first-child),th:not(:first-child){text-align:right}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0}.field input{width:130px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}input[type=number]{text-align:right}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:0 10px 40px #0005}.dialog h2{margin-bottom:8px}.dialog-actions{display:flex;gap:10px;margin-top:16px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.keypad button{font-size:22px;padding:14px}.keypad .wide{grid-column:span 2}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;transition:.25s;z-index:8}#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--bad);color:#fff}
@media(max-width:800px){header{padding:9px 14px}.clock{font-size:16px}nav{padding-left:14px;padding-right:14px}main{padding:12px 14px}.dashboard{grid-template-columns:1fr;min-height:0}.tankcard{min-height:0;padding:12px}.tankcard #tank{max-height:50vh}.settings-grid{grid-template-columns:1fr}.presets{grid-template-columns:repeat(2,1fr)}.custom{grid-column:span 2}}
</style>
</head>
<body>
<header><h1>RO tank</h1><span class="grow"></span><span class="clock" id="clock">--:--:--</span><button class="alt" onclick="showPage('settings')">⚙ Settings</button></header>
<nav><button id="navDash" class="active" onclick="showPage('dashboard')">Dispense</button><button id="navPours" onclick="showPage('pours')">Recent pours</button><button id="navSettings" onclick="showPage('settings')">Settings</button></nav>
<main>
<section id="dashboard" class="page active">
<div class="dashboard">
<section class="card tankcard">
<svg id="tank" viewBox="0 0 220 300" role="img" aria-label="Tank level"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#50b6e8"/><stop offset="1" stop-color="#2183bd"/></linearGradient><clipPath id="clip"><rect x="44" y="20" width="142" height="260" rx="11"/></clipPath></defs><rect class="body" x="42" y="18" width="146" height="264" rx="13"/><g clip-path="url(#clip)"><g id="water" style="transform:translateY(270px)"><g transform="translate(44,20)"><path class="wave" fill="url(#wg)" d="M0 0q16.75-7 33.5 0t33.5 0t33.5 0t33.5 0t33.5 0t33.5 0t33.5 0V300H0Z"/></g></g></g><line class="tick" x1="30" x2="40" y1="85" y2="85"/><text class="tl" x="26" y="89">75</text><line class="tick" x1="30" x2="40" y1="150" y2="150"/><text class="tl" x="26" y="154">50</text><line class="tick" x1="30" x2="40" y1="215" y2="215"/><text class="tl" x="26" y="219">25</text><text id="pctText" x="115" y="165">–</text></svg>
<div class="tankstats"><div class="stat"><b id="ml">–</b><small>ml left</small></div><div class="stat"><b id="inR">–</b><small>ml/s in</small></div><div class="stat"><b id="outR">–</b><small>ml/s out</small></div></div>
</section>
<div class="right"><section class="card status"><span id="dot" class="dot"></span><div><h2 id="pourStatus">Idle</h2><div class="sub" id="statusDetail">Ready</div></div><span class="grow"></span><span class="sub" id="capacity"></span></section>
<section class="card"><h2>Dispense preset</h2><div id="presets" class="presets"></div></section>
<section class="card"><h2>System</h2><div class="rows"><div><div class="sub">Tank</div><b id="tankState">–</b></div><div><div class="sub">Network</div><b id="network">–</b></div></div></section></div>
</div></section>
<section id="pours" class="page card"><h2>Recent pours</h2><div id="recent"></div><p class="sub"><a href="/pours.csv">Download pours.csv</a></p></section>
<section id="settings" class="page card"><h2>Settings</h2><div class="settings-grid"><div><h2>Tank</h2><label class="field">Known total capacity (ml)<input id="capInput" type="number" min="1" max="9000" step="1"></label><button onclick="saveSettings()">Save settings</button><h2 style="margin-top:26px">Calibration</h2><div id="wiz"></div></div><div><h2>Preset amounts</h2><p class="sub">Set any button to zero to leave it unused.</p><div id="presetInputs"></div><p class="sub">Calibration data: <a href="/refill_log.csv">refill_log.csv</a></p></div></div></section>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);let S=null,timer=null,toastTimer=null,lastDispensePhase=null;
const fmt=n=>Math.round(n).toLocaleString(),dur=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));const nav={dashboard:'navDash',pours:'navPours',settings:'navSettings'};Object.values(nav).forEach(x=>$(x).classList.remove('active'));$(nav[p]).classList.add('active');if(p==='settings')renderSettings()}
function toast(msg,ok=true){const t=$('toast');t.textContent=msg;t.className='on'+(ok?'':' err');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',4500)}
async function call(path,params){try{const r=await fetch(path+'?'+new URLSearchParams(params),{method:'POST'}),j=await r.json();toast(j.msg,j.ok);poll();return j}catch(e){toast('Request failed.',false)}}
function setTank(pct){const p=Math.max(0,Math.min(1,(pct||0)/100)),off=p>=.99?-8:p<=.002?270:260*(1-p)+10;$('water').style.transform='translateY('+off+'px)';$('pctText').textContent=S&&S.cal?Math.min(100,Math.round(pct))+'%':'–';$('tank').className=p>.45?'hi':'lo'}
function render(){if(!S)return;const has=S.cal&&S.ml!==undefined;setTank(has?S.pct:0);$('ml').textContent=has?fmt(S.ml):'–';$('inR').textContent=has?S.in.toFixed(1):'–';$('outR').textContent=has?S.out.toFixed(1):'–';$('capacity').textContent=S.cap?fmt(S.cap)+' ml total':'';$('tankState').textContent=has?(S.state||'Idle'):(S.cal?'Waiting':'Needs calibration');$('network').textContent=S.ip||'offline';renderStatus();renderPresets();renderRecent()}
function renderStatus(){const d=S.dispense,active=d&&(d.phase==='dispensing'),waiting=d&&(d.phase==='await_close'||d.phase==='await_final_close');$('dot').className='dot '+(active?'active':waiting?'warn':'');$('pourStatus').textContent=active?'Active':waiting?'Confirm tap closed':'Idle';$('statusDetail').textContent=!d?'Ready':d.phase==='await_close'?'Close the tap, then confirm below.':d.phase==='await_final_close'?'Close the tap again, then confirm below.':fmt(d.ml)+' / '+fmt(d.target)+' ml';if(d&&(waiting||active)){$('statusDetail').innerHTML+=' <button class="alt" style="margin-left:8px;padding:6px 10px" onclick="call(\\'/api/dispense\\',{action:\\'confirm\\'})">'+(d.phase==='dispensing'?'Waiting':'Confirm')+'</button>'}if(waiting&&d.phase!==lastDispensePhase)openDispensePrompt(d.phase);lastDispensePhase=d?d.phase:null}
function renderPresets(){const p=S&&S.presets||[];let h='';p.forEach((v,i)=>{h+='<button class="preset" '+(v?'onclick="call(\\'/api/dispense\\',{action:\\'request\\',ml:'+v+'})"':'disabled')+'>'+fmt(v)+'<small> ml</small></button>'});h+='<button class="preset custom" onclick="openCustom()">Custom amount</button>';$('presets').innerHTML=h}
function renderRecent(){if(!S||!S.recent||!S.recent.length){$('recent').innerHTML='<p class="muted">Nothing yet.</p>';return}let h='<table><tr><th>When</th><th>Dispensed</th><th>Time</th><th>Tank</th></tr>';S.recent.forEach(r=>{h+='<tr><td>'+new Date(r[0]*1000).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</td><td>'+fmt(r[1])+' ml</td><td>'+dur(r[2])+'</td><td>'+Math.round(r[3])+'% to '+Math.round(r[4])+'%</td></tr>'});$('recent').innerHTML=h+'</table>'}
function renderSettings(){if(!S)return;$('capInput').value=S.cap||'';let h='';(S.presets||[]).forEach((v,i)=>h+='<label class="field">Button '+(i+1)+'<input id="p'+i+'" type="number" min="0" max="9000" step="1" value="'+v+'"></label>');$('presetInputs').innerHTML=h;buildWiz()}
function saveSettings(){const q={cap:$('capInput').value};for(let i=0;i<8;i++)q['p'+i]=$('p'+i).value;call('/api/settings',q)}
function buildWiz(){const e=$('wiz');if(!S)return;if(S.step==='idle'){e.innerHTML='<p class="sub">'+(S.cal?'Calibrated capacity: '+fmt(S.cap)+' ml.':'The scale needs calibration.')+'</p><button class="alt" onclick="call(\\'/api/cal\\',{action:\\''+(S.cal?'start':'start')+'\\'})">'+(S.cal?'Recalibrate':'Start calibration')+'</button>';return}let x={full:'Record full weight when steady.',close:'Close the inlet valve.',drain:'Drain the tank completely, then record empty.',grams:'Enter the collected water weight.',open:'Open the inlet valve and start refill logging.',refill:'Refill logging is active.'}[S.step]||'Calibration';e.innerHTML='<p><b>'+x+'</b></p>';if(S.step==='grams')e.innerHTML+='<input id="grams" type="number" min="500" max="20000" placeholder="grams"> ';const a={full:'record_full',close:'valve_closed',drain:'record_empty',grams:'grams',open:'start_refill',refill:'finish'}[S.step];e.innerHTML+='<button onclick="calNext(\\''+a+'\\')">Continue</button> <button class="alt" onclick="call(\\'/api/cal\\',{action:\\'cancel\\'})">Cancel</button>'}
function calNext(a){const q={action:a};if(a==='grams')q.g=$('grams').value;call('/api/cal',q)}
function openDispensePrompt(phase){$('modalTitle').textContent=phase==='await_close'?'Close the tap':'Close the tap again';$('modalBody').innerHTML='<p>Confirm only when the tap is fully closed.</p><div class="dialog-actions"><button class="alt" onclick="closeModal();call(\\'/api/dispense\\',{action:\\'cancel\\'})">Cancel</button><button onclick="closeModal();call(\\'/api/dispense\\',{action:\\'confirm\\'})">Confirm closed</button></div>';$('modal').className='modal open'}
function openCustom(){let n='';$('modalTitle').textContent='Custom dispense';$('modalBody').innerHTML='<input id="customValue" readonly style="width:100%;font-size:28px;text-align:center" value="0"><div class="keypad">'+[1,2,3,4,5,6,7,8,9].map(x=>'<button onclick="key('+x+')">'+x+'</button>').join('')+'<button class="wide" onclick="key(0)">0</button><button onclick="key(\\'c\\')">Clear</button></div><div class="dialog-actions"><button class="alt" onclick="closeModal()">Cancel</button><button onclick="customSubmit()">OK</button></div>';$('modal').className='modal open'}
function key(x){const e=$('customValue');if(x==='c')e.value='0';else if(e.value==='0')e.value=String(x);else if(e.value.length<4)e.value+=x;if(+e.value>9000)e.value='9000'}
function customSubmit(){const v=+$('customValue').value;if(v<1){toast('Enter an amount from 1 to 9000 ml.',false);return}closeModal();call('/api/dispense',{action:'request',ml:v})}function closeModal(){$('modal').className='modal'}
function updateClock(){$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}setInterval(updateClock,1000);updateClock();
async function poll(){clearTimeout(timer);try{const r=await fetch('/api/state',{cache:'no-store'});S=await r.json();render();timer=setTimeout(poll,S.dispense?400:1000)}catch(e){timer=setTimeout(poll,2000)}}poll();
</script>
</body>
</html>
